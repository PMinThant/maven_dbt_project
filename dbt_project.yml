name: maven_dbt_project

profile: maven_dbt_project

seed-paths: ["seeds"]
model-paths: ["models"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  maven_dbt_project:
    +schema: raw

models:
  maven_dbt_project:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
